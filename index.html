const TweaksCtx = React.createContext(null);

function useTweaks(defaults) {
  const [tweaks, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues(prev => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return { tweaks, setTweak };
}

function TweaksPanel({ tweaks, setTweak, title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <TweaksCtx.Provider value={{ tweaks, setTweak }}>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </TweaksCtx.Provider>
  );
}

function TweakSection({ title, children }) {
  return (
    <>
      <div className="twk-sect">{title}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ id, label }) {
  const { tweaks, setTweak } = React.useContext(TweaksCtx);
  const value = tweaks[id];
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => setTweak(id, !value)}><i /></button>
    </div>
  );
}

function TweakRadio({ id, label, options }) {
  const { tweaks, setTweak } = React.useContext(TweaksCtx);
  const value = tweaks[id];
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) setTweak(id, v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) setTweak(id, v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakColor({ id, label, swatches = [] }) {
  const { tweaks, setTweak } = React.useContext(TweaksCtx);
  const value = tweaks[id];
  return (
    <TweakRow label={label} value={value}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {swatches.map((c) => (
          <button key={c} type="button" title={c} onClick={() => setTweak(id, c)}
                  style={{ width: 18, height: 18, borderRadius: '50%', background: c, cursor: 'pointer',
                           border: '1px solid rgba(0,0,0,0.2)',
                           outline: value === c ? '2px solid currentColor' : 'none', outlineOffset: 2 }} />
        ))}
        <input type="color" value={value} onChange={(e) => setTweak(id, e.target.value)}
               style={{ width: 24, height: 22, padding: 0, border: 'none', background: 'none', cursor: 'pointer' }} />
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function calcAge(dob) {
  const d = new Date(dob), now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  if (now < new Date(now.getFullYear(), d.getMonth(), d.getDate())) age--;
  return age;
}
function formatTime(d = new Date()) {
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}
function formatDate(d = new Date()) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function minutesAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'just now';
  if (diff === 1) return '1 min ago';
  return `${diff} min ago`;
}

// Full display name — extensionName is the patient's second last name, used as
// an extra identifier where two patients share a first + last name.
function patientName(p) {
  if (!p) return '';
  return [p.firstName, p.lastName, p.extensionName].filter(Boolean).join(' ');
}

// ─── DENSITY ──────────────────────────────────────────────────────────────────
// The density tweak scales the px spacing inside Cards, which is where nearly
// all of the app's whitespace lives.
const DENSITY_SCALE = { compact: 0.7, comfortable: 1, spacious: 1.3 };

function useDensity() {
  const ctx = React.useContext(TweaksCtx);
  return DENSITY_SCALE[ctx && ctx.tweaks && ctx.tweaks.density] || 1;
}

function scalePx(value, scale) {
  if (scale === 1 || value == null) return value;
  if (typeof value === 'number') return Math.round(value * scale);
  if (typeof value !== 'string') return value;
  return value.replace(/(\d+(?:\.\d+)?)px/g, (_, n) => `${Math.round(parseFloat(n) * scale)}px`);
}

// Reads the queueStyle tweak: 'compact' hides the detail drawer, 'detailed'
// keeps every card open, 'hybrid' is click-to-expand.
function useQueueStyle() {
  const ctx = React.useContext(TweaksCtx);
  return (ctx && ctx.tweaks && ctx.tweaks.queueStyle) || 'hybrid';
}

            }}>

}

// ─── TRIAGE VIEWS ─────────────────────────────────────────────────────────────
function TriageSearch({ patients, onCheckIn, onNewPatient }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState(null);
  const [searched, setSearched] = useState(false);

  const search = () => {
    if (!query.trim()) return;
    const q = query.toLowerCase();
    const found = patients.filter(p =>
      patientName(p).toLowerCase().includes(q) ||
      (p.phone || '').includes(q) || p.id.toLowerCase().includes(q)
    );
    setResults(found);
    setSearched(true);
  };

  return (
    <div style={{ maxWidth: 680, margin: '0 auto', padding: '32px 24px' }}>
      <div style={{ marginBottom: 32 }}>
        <h1 style={{ fontSize: 24, fontWeight: 600, color: 'var(--sand-900)', marginBottom: 4 }}>Patient Search</h1>
        <p style={{ fontSize: 14, color: 'var(--sand-600)' }}>Search by name, phone number, or patient ID</p>
      </div>

      <Card style={{ padding: '24px', marginBottom: 24 }}>
        <div style={{ display: 'flex', gap: 12 }}>
          <input
            value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && search()}
            placeholder="Search patients..."
            style={{
              flex: 1, padding: '12px 16px', borderRadius: 'var(--radius-md)',
              border: '1.5px solid var(--sand-300)', fontSize: 15,
              fontFamily: 'var(--font-body)', outline: 'none', color: 'var(--sand-900)'
            }} />
          <Button onClick={search} size="lg">Search</Button>
        </div>
      </Card>

      {searched && (
        <div className="animate-in">
          {results.length === 0 ? (
            <Card style={{ padding: '32px', textAlign: 'center' }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>🔍</div>
              <div style={{ fontSize: 16, fontWeight: 500, color: 'var(--sand-800)', marginBottom: 8 }}>No patients found</div>
              <div style={{ fontSize: 14, color: 'var(--sand-500)', marginBottom: 20 }}>No records match "{query}"</div>
              <Button onClick={onNewPatient}>Register New Patient</Button>
            </Card>
          ) : (
            <div>
              <SectionHeader title="Results" count={results.length} />
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {results.map(p => (
                  <PatientSearchCard key={p.id} patient={p} onSelect={() => onCheckIn(p)} />
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {!searched && (
        <div style={{ textAlign: 'center', padding: '32px 0' }}>
          <Button variant="outline" onClick={onNewPatient}>+ Register New Patient</Button>
        </div>
      )}
    </div>
  );
}

const NEW_PATIENT_INIT = {
  firstName: '', lastName: '', extensionName: '', dob: '', gender: '', phone: '', email: '', location: 'Clinic A'
};

function NewPatientForm({ onComplete, onDirtyChange }) {
  const [form, setForm] = useState(NEW_PATIENT_INIT);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  useReportDirty(
    Object.keys(NEW_PATIENT_INIT).some(k => form[k] !== NEW_PATIENT_INIT[k]),
    onDirtyChange
  );

  const submit = () => {
    if (!form.firstName || !form.lastName || !form.dob) {
      alert('Please fill in all required fields.');
      return;
    }
    onComplete({
      id: 'P' + Date.now(),
      ...form, photo: null, allergies: [], visits: []

  };

  return (
    <div style={{ maxWidth: 600, margin: '0 auto', padding: '32px 24px' }}>
      <div style={{ marginBottom: 24 }}>

      </div>

      <Card style={{ padding: '24px', marginBottom: 16 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Input label="First Name" value={form.firstName} onChange={v => set('firstName', v)} required />
          <Input label="Last Name" value={form.lastName} onChange={v => set('lastName', v)} required />

            hint="Second last name / additional identifier" />
          <Input label="Date of Birth" value={form.dob} onChange={v => set('dob', v)} type="date" required />
          <Select label="Gender" value={form.gender} onChange={v => set('gender', v)} required options={[
            { value: '', label: 'Select...' },
            { value: 'Male', label: 'Male' },
            { value: 'Female', label: 'Female' },
            { value: 'Non-binary', label: 'Non-binary' },
            { value: 'Prefer not to say', label: 'Prefer not to say' },
            { value: 'Other', label: 'Other' },
          ]} />
          <Input label="Phone Number" value={form.phone} onChange={v => set('phone', v)} hint="Optional" />
          <Input label="Email" value={form.email} onChange={v => set('email', v)} hint="For visit summary" />
          <Input label="Clinic Site" value={form.location} onChange={v => set('location', v)} required />

      <Card style={{ padding: '24px', marginBottom: 20 }}>
        <div style={{ marginBottom: 12, fontSize: 13, fontWeight: 600, color: 'var(--sand-700)' }}>

        </div>
        <div style={{
          border: '2px dashed var(--sand-300)', borderRadius: 'var(--radius-md)', padding: '32px',
          textAlign: 'center', color: 'var(--sand-500)', cursor: 'pointer'

          <div style={{ fontSize: 14, marginBottom: 4 }}>Take photo or upload</div>
          <div style={{ fontSize: 12 }}>Center patient's face, neutral expression, adequate lighting</div>
          <Button variant="secondary" size="sm" style={{ marginTop: 12 }}>Choose Photo</Button>
        </div>

        {/* Photo consent script — read aloud to the patient before capturing */}
        <div style={{
          marginTop: 16, padding: '14px 16px', background: 'var(--blue-50)',
          border: '1.5px solid var(--blue-100)', borderRadius: 'var(--radius-md)'
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--blue-600)', letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 10 }}>
            🗣 Read aloud to the patient before taking the photo
          </div>

          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', marginBottom: 3 }}>English</div>
            <p style={{ fontSize: 13, color: 'var(--sand-800)', lineHeight: 1.6 }}>
              We would like to take your photograph and keep it with your medical record. The photo is
              used for one purpose only: to confirm who you are when you come back to see us, so we can
              find your record quickly and be sure that any care, medications, or test results are
              matched to the right person. Do you give us permission to take and store your photograph
              for this purpose?
            </p>
          </div>

            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', marginBottom: 3 }}>Español</div>
            <p style={{ fontSize: 13, color: 'var(--sand-800)', lineHeight: 1.6 }}>
              Quisiéramos tomarle una fotografía y guardarla junto con su expediente médico. La fotografía
              se usa únicamente para confirmar su identidad cuando regrese a vernos, de modo que podamos
              encontrar su expediente rápidamente y asegurarnos de que la atención, los medicamentos y los

function VitalsForm({ patient, onComplete, onDirtyChange }) {
  const isReturning = patient.visits.length > 0;
  const [vitals, setVitals] = useState({
    bpSys: '', bpDia: '', hr: '', rr: '', temp: '', weight: '', height: '', spo2: '',
    chiefComplaint: ''
  });
  const [allergies, setAllergies] = useState(patient.allergies.join(', '));
  const [allergyConfirmed, setAllergyConfirmed] = useState(false);
  const [selectedVisit, setSelectedVisit] = useState(null);
  const [tempUnit, setTempUnit] = useState('°F');
  const [weightUnit, setWeightUnit] = useState('kg');
  const [heightUnit, setHeightUnit] = useState('cm');

  const setV = (k, v) => setVitals(vit => ({ ...vit, [k]: v }));

  useReportDirty(
    Object.values(vitals).some(v => v && String(v).trim()) ||
    allergies !== patient.allergies.join(', ') ||
    allergyConfirmed,
    onDirtyChange
  );

  const warnings = [];
  if (vitals.spo2 && parseFloat(vitals.spo2) < 90) warnings.push('SpO₂ below 90% — verify reading');
  if (vitals.hr && (parseInt(vitals.hr) > 120 || parseInt(vitals.hr) < 40)) warnings.push('Heart rate outside normal range');
  if (vitals.bpSys && parseInt(vitals.bpSys) > 180) warnings.push('Systolic BP critically elevated');

  const submit = () => {
    if (!vitals.chiefComplaint) { alert('Chief complaint is required.'); return; }
    if (isReturning && !allergyConfirmed && patient.allergies.length > 0) {
      alert('Please confirm allergies before check-in.'); return;
    }
    onComplete({
      vitals: { ...vitals, tempUnit, weightUnit, heightUnit },
      allergies: allergies.split(',').map(a => a.trim()).filter(Boolean),
      chiefComplaint: vitals.chiefComplaint,
      checkInTime: Date.now()
    });
  };

  return (
    <div style={{ maxWidth: 680, margin: '0 auto', padding: '32px 24px' }}>
      {/* Patient header */}
      <Card style={{ padding: '16px 20px', marginBottom: 20, background: 'var(--sand-50)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <PhotoPlaceholder name={patientName(patient)} size={48} />
          <div>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{patientName(patient)}</div>
            <div style={{ fontSize: 13, color: 'var(--sand-600)' }}>
              {calcAge(patient.dob)}y · {patient.gender} · {isReturning ? `${patient.visits.length} prior visit(s)` : 'New patient'}
            </div>
          </div>
          {isReturning && <Badge color="teal" size="md">Returning Patient</Badge>}
        </div>
      </Card>

      {/* Allergy banner for returning */}
      {isReturning && patient.allergies.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <AllergyBanner allergies={patient.allergies} />
        </div>
      )}

      {/* Past visit history — read-only drill-in to the SOAPP note */}
      {isReturning && (
        <Card style={{ padding: '20px 22px', marginBottom: 16 }}>
          <SectionHeader title="Past Visit History" count={patient.visits.length} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {patient.visits.slice().reverse().map(v => (
              <div key={v.id} onClick={() => setSelectedVisit(v)}
                style={{
                  padding: '10px 14px', background: 'var(--sand-50)', border: '1px solid var(--sand-200)',
                  borderRadius: 'var(--radius-sm)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12
                }}
                onMouseEnter={e => e.currentTarget.style.background = 'var(--sand-100)'}
                onMouseLeave={e => e.currentTarget.style.background = 'var(--sand-50)'}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--sand-800)', marginBottom: 2 }}>
                    {v.date} · {v.provider}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--sand-600)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {v.soapp?.assessment || 'No assessment recorded'}
                  </div>
                </div>
                {v.prescriptions?.length > 0 && <Badge color="teal">{v.prescriptions.length} Rx</Badge>}
                <span style={{ fontSize: 12, color: 'var(--teal-500)', whiteSpace: 'nowrap' }}>View note →</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Warnings */}
      {warnings.length > 0 && (
        <div style={{ marginBottom: 16, background: 'var(--amber-100)', border: '1.5px solid var(--amber-400)', borderRadius: 'var(--radius-md)', padding: '10px 14px' }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--amber-600)', marginBottom: 4 }}>⚠ Vital Signs Alert</div>
          {warnings.map((w, i) => <div key={i} style={{ fontSize: 13, color: 'var(--amber-600)' }}>{w}</div>)}
        </div>
      )}

      <Card style={{ padding: '24px', marginBottom: 16 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-800)', marginBottom: 16 }}>Vitals</h3>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <Input label="Systolic BP" value={vitals.bpSys} onChange={v => setV('bpSys', v)} placeholder="120" unit="mmHg" />
            <Input label="Diastolic BP" value={vitals.bpDia} onChange={v => setV('bpDia', v)} placeholder="80" unit="mmHg" />
          </div>
          <Input label="Heart Rate" value={vitals.hr} onChange={v => setV('hr', v)} placeholder="72" unit="bpm" />
          <Input label="Respiratory Rate" value={vitals.rr} onChange={v => setV('rr', v)} placeholder="16" unit="/min" />
          <Input label="Temperature" value={vitals.temp} onChange={v => setV('temp', v)} placeholder="98.6"
            unit={tempUnit} unitOptions={['°F', '°C']} onUnitChange={setTempUnit} />
          <Input label="Weight" value={vitals.weight} onChange={v => setV('weight', v)} placeholder="70"
            unit={weightUnit} unitOptions={['kg', 'lbs']} onUnitChange={setWeightUnit} />
          <Input label="Height" value={vitals.height} onChange={v => setV('height', v)} placeholder="170"
            unit={heightUnit} unitOptions={['cm', 'in']} onUnitChange={setHeightUnit} />
          <Input label="SpO₂" value={vitals.spo2} onChange={v => setV('spo2', v)} placeholder="99" unit="%" />
        </div>
      </Card>

      <Card style={{ padding: '24px', marginBottom: 16 }}>
        <Textarea label="Chief Complaint" value={vitals.chiefComplaint} onChange={v => setV('chiefComplaint', v)}
          placeholder="Patient's primary reason for visit..." rows={3} required />
        <div style={{ marginTop: 14 }}>
          <Input label="Allergies & Intolerances" value={allergies} onChange={setAllergies}
            placeholder="Penicillin, Sulfa drugs... (or NKDA)" hint="Separate multiple allergies with commas" />
          {isReturning && patient.allergies.length > 0 && (
            <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'var(--sand-100)', borderRadius: 'var(--radius-sm)' }}>
              <input type="checkbox" id="allergyConfirm" checked={allergyConfirmed} onChange={e => setAllergyConfirmed(e.target.checked)}
                style={{ width: 16, height: 16, cursor: 'pointer' }} />
              <label htmlFor="allergyConfirm" style={{ fontSize: 13, color: 'var(--sand-700)', cursor: 'pointer' }}>
                Confirmed unchanged — allergies reviewed and accurate
              </label>
            </div>
          )}
        </div>
      </Card>

      <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
        <Button variant="secondary">Cancel</Button>
        <Button onClick={submit}>
          ✓ Check In & Send to Care Queue
        </Button>
      </div>

      {selectedVisit && (
        <VisitDetailModal visit={selectedVisit} patient={patient} onClose={() => setSelectedVisit(null)} />
      )}
    </div>
  );
}

// ─── PROVIDER VIEWS ───────────────────────────────────────────────────────────
function CareQueue({ queue, onAssume }) {
  const [expanded, setExpanded] = useState(null);
  const queueStyle = useQueueStyle();
  const isOpen = (id) => queueStyle === 'detailed' ? true : queueStyle === 'compact' ? false : expanded === id;
  const toggler = (id) => queueStyle === 'hybrid' ? () => setExpanded(expanded === id ? null : id) : null;

  return (
    <div style={{ padding: '24px', maxWidth: 900, margin: '0 auto' }}>
      <div style={{ marginBottom: 24, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 600, color: 'var(--sand-900)' }}>Care Queue</h1>
          <p style={{ fontSize: 13, color: 'var(--sand-600)', marginTop: 2 }}>Patients waiting to be seen</p>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#30A99B', animation: 'pulse 2s infinite' }}></div>
          <span style={{ fontSize: 12, color: 'var(--sand-600)' }}>Live</span>
        </div>
      </div>

      {queue.length === 0 ? (
        <Card style={{ padding: '60px', textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <div style={{ fontSize: 16, fontWeight: 500, color: 'var(--sand-700)' }}>Queue is empty</div>
          <div style={{ fontSize: 13, color: 'var(--sand-500)', marginTop: 4 }}>All patients have been seen</div>
        </Card>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {queue.map((item, i) => (
            <QueueCard key={item.id} item={item} index={i}
              expanded={isOpen(item.id)}
              onToggle={toggler(item.id)}
              onAssume={() => onAssume(item)}
              actionLabel="Assume Patient"
              showVitals />
          ))}
        </div>
      )}
    </div>
  );
}

function QueueCard({ item, index, expanded, onToggle, onAssume, actionLabel, showVitals }) {
  const age = item.patient ? calcAge(item.patient.dob) : '';
  const waitMins = Math.floor((Date.now() - item.checkInTime) / 60000);
  const hasAllergies = item.patient?.allergies?.length > 0;
  const scale = useDensity();
  const pad = scalePx('16px 20px', scale);

  return (
    <Card style={{ overflow: 'visible' }}>
      <div style={{ padding: pad, display: 'flex', alignItems: 'center', gap: 14, cursor: onToggle ? 'pointer' : 'default' }}
        onClick={onToggle || undefined}>
        {/* Position */}
        <div style={{ width: 28, height: 28, borderRadius: '50%', background: index === 0 ? 'var(--accent)' : 'var(--sand-200)',
          color: index === 0 ? '#fff' : 'var(--sand-600)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 13, fontWeight: 600, flexShrink: 0 }}>{index + 1}</div>
        <PhotoPlaceholder name={patientName(item.patient)} size={44} />
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 3 }}>
            <span style={{ fontSize: 15, fontWeight: 600 }}>{patientName(item.patient)}</span>
            <span style={{ fontSize: 13, color: 'var(--sand-500)' }}>{age}y · {item.patient.gender}</span>
            {hasAllergies && <Badge color="red">⚠ Allergies</Badge>}
            {item.patient.visits.length > 0 && <Badge color="teal">Returning</Badge>}
          </div>
          <div style={{ fontSize: 13, color: 'var(--sand-600)' }}>
            <span style={{ marginRight: 12 }}>🕐 {minutesAgo(item.checkInTime)}</span>
            <span style={{ marginRight: 12 }}>👤 Triage: {item.triageInitials}</span>
            {item.vitals?.chiefComplaint && <span>"{item.vitals.chiefComplaint}"</span>}
          </div>
        </div>
        {/* Vital flags */}
        {showVitals && item.warnings?.length > 0 && (
          <Badge color="amber">⚠ {item.warnings.length} flag{item.warnings.length > 1 ? 's' : ''}</Badge>
        )}
        <Button onClick={e => { e.stopPropagation(); onAssume(); }} size="sm">{actionLabel}</Button>
        {onToggle && <span style={{ color: 'var(--sand-400)', fontSize: 14, marginLeft: 4 }}>{expanded ? '▲' : '▼'}</span>}
      </div>

      {expanded && (
        <div className="animate-in" style={{ borderTop: '1px solid var(--sand-100)', padding: pad, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          {/* Vitals summary */}
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--sand-600)', marginBottom: 8 }}>VITALS</div>
            {item.vitals && (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                {[
                  ['BP', `${item.vitals.bpSys || '—'}/${item.vitals.bpDia || '—'}`, false],
                  ['HR', item.vitals.hr ? `${item.vitals.hr} bpm` : '—', item.vitals.hr && (parseInt(item.vitals.hr) > 120 || parseInt(item.vitals.hr) < 40)],
                  ['Temp', item.vitals.temp ? `${item.vitals.temp}${item.vitals.tempUnit}` : '—', false],
                  ['SpO₂', item.vitals.spo2 ? `${item.vitals.spo2}%` : '—', item.vitals.spo2 && parseFloat(item.vitals.spo2) < 90],
                  ['RR', item.vitals.rr ? `${item.vitals.rr}/min` : '—', false],
                  ['Wt', item.vitals.weight ? `${item.vitals.weight}${item.vitals.weightUnit}` : '—', false],
                ].map(([l, v, warn]) => (
                  <div key={l} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 8px',
                    background: warn ? 'var(--amber-100)' : 'var(--sand-50)', borderRadius: 4 }}>
                    <span style={{ fontSize: 12, color: 'var(--sand-500)' }}>{l}</span>
                    <span style={{ fontSize: 12, fontWeight: 500, color: warn ? 'var(--amber-600)' : 'var(--sand-800)' }}>
                      {v} {warn && '⚠'}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
          {/* Allergies + history */}
          <div>
            <AllergyBanner allergies={item.patient.allergies} />
            {item.patient.visits.length > 0 && (
              <div style={{ marginTop: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--sand-600)', marginBottom: 6 }}>PRIOR VISITS</div>
                {item.patient.visits.slice(-2).map(v => (
                  <div key={v.id} style={{ fontSize: 12, color: 'var(--sand-600)', padding: '4px 0', borderBottom: '1px solid var(--sand-100)' }}>
                    {v.date} · {v.provider} · {v.soapp.assessment}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </Card>
  );
}

// ─── SOAPP NOTE VIEW ──────────────────────────────────────────────────────────
function SOAPPView({ item, onClose, onSendToPharmacy, onDirtyChange }) {
  const [note, setNote] = useState({ subjective: '', objective: '', assessment: '', plan: '', procedures: '' });
  const [adminMeds, setAdminMeds] = useState([]);
  const [rxRequests, setRxRequests] = useState([]);
  const [activeTab, setActiveTab] = useState('soapp');
  const [lastSaved, setLastSaved] = useState(null);
  const [showCloseConfirm, setShowCloseConfirm] = useState(false);
  const [vitals, setVitals] = useState(item.vitals || {});
  const [vitalsDraft, setVitalsDraft] = useState(null);

  const setN = (k, v) => setNote(n => ({ ...n, [k]: v }));

  useReportDirty(
    Object.values(note).some(v => v.trim()) ||
    adminMeds.length > 0 ||
    rxRequests.length > 0 ||
    !!vitalsDraft ||
    JSON.stringify(vitals) !== JSON.stringify(item.vitals || {}),
    onDirtyChange
  );

  // Auto-save simulation
  useEffect(() => {
    const t = setInterval(() => setLastSaved(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const addAdminMed = () => setAdminMeds(m => [...m, { id: Date.now(), name: '', dose: '', unit: 'mg', route: 'Oral', time: formatTime() }]);
  const updateMed = (id, k, v) => setAdminMeds(m => m.map(x => x.id === id ? { ...x, [k]: v } : x));
  const removeMed = (id) => setAdminMeds(m => m.filter(x => x.id !== id));

  const addRx = () => setRxRequests(r => [...r, { id: Date.now(), name: '', dose: '', unit: 'mg', route: 'Oral', sig: '', notes: '' }]);
  const updateRx = (id, k, v) => setRxRequests(r => r.map(x => x.id === id ? { ...x, [k]: v } : x));
  const removeRx = (id) => setRxRequests(r => r.filter(x => x.id !== id));

  const handleSendToPharmacy = () => {
    if (rxRequests.length === 0) { alert('Add at least one pharmacy request, or use "Close Visit Directly".'); return; }
    onSendToPharmacy({ note, adminMeds, rxRequests, vitals });
  };

  const soappSections = [
    { key: 'subjective', label: 'S — Subjective', placeholder: "Patient's reported symptoms, chief complaint, history of present illness..." },
    { key: 'objective', label: 'O — Objective', placeholder: 'Clinical observations, physical exam findings, reference to vitals...' },
    { key: 'assessment', label: 'A — Assessment', placeholder: 'Diagnosis or differential diagnosis...' },
    { key: 'plan', label: 'P — Plan', placeholder: 'Treatment plan, follow-up instructions, referrals...' },
    { key: 'procedures', label: 'Procedures', placeholder: 'Procedures completed during this encounter...' },
  ];

  return (
    <div style={{ display: 'flex', height: '100%', overflow: 'hidden' }}>
      {/* Left pane — patient info */}
      <div style={{ width: 280, background: 'var(--sand-50)', borderRight: '1px solid var(--sand-200)', display: 'flex', flexDirection: 'column', overflow: 'hidden', flexShrink: 0 }}>
        <div style={{ padding: '20px 18px', borderBottom: '1px solid var(--sand-200)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
            <PhotoPlaceholder name={patientName(item.patient)} size={52} />
            <div>
              <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--sand-900)' }}>{patientName(item.patient)}</div>
              <div style={{ fontSize: 12, color: 'var(--sand-600)' }}>{calcAge(item.patient.dob)}y · {item.patient.gender}</div>
              <div style={{ fontSize: 11, color: 'var(--sand-500)' }}>ID: {item.patient.id}</div>
            </div>
          </div>
          <AllergyBanner allergies={item.patient.allergies} />
        </div>

        {/* Current vitals — provider-editable */}
        <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--sand-200)' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Current Vitals</div>
            {!vitalsDraft && (
              <button onClick={() => setVitalsDraft({ ...vitals })}
                style={{ background: 'none', border: 'none', color: 'var(--accent)', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: 'var(--font-body)', padding: 0 }}>
                ✎ Edit
              </button>
            )}
          </div>

          {vitalsDraft ? (
            <div className="animate-in">
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                {[
                  ['bpSys', 'Systolic'], ['bpDia', 'Diastolic'],
                  ['hr', 'HR (bpm)'], ['rr', 'RR (/min)'],
                  ['temp', `Temp (${vitalsDraft.tempUnit || '°F'})`], ['spo2', 'SpO₂ (%)'],
                  ['weight', `Wt (${vitalsDraft.weightUnit || 'kg'})`], ['height', `Ht (${vitalsDraft.heightUnit || 'cm'})`],
                ].map(([k, label]) => (
                  <div key={k} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                    <label style={{ fontSize: 10, color: 'var(--sand-500)', fontWeight: 500 }}>{label}</label>
                    <input value={vitalsDraft[k] || ''} onChange={e => setVitalsDraft(d => ({ ...d, [k]: e.target.value }))}
                      style={{
                        width: '100%', padding: '5px 7px', borderRadius: 5, border: '1.5px solid var(--sand-300)',
                        fontSize: 12, fontFamily: 'var(--font-body)', color: 'var(--sand-900)', background: '#fff', outline: 'none'
                      }} />
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
                <Button size="sm" style={{ flex: 1 }}
                  onClick={() => { setVitals(vitalsDraft); setVitalsDraft(null); setLastSaved(new Date()); }}>Save Vitals</Button>
                <Button size="sm" variant="secondary" onClick={() => setVitalsDraft(null)}>Cancel</Button>
              </div>
              <div style={{ fontSize: 10, color: 'var(--sand-400)', marginTop: 6, lineHeight: 1.4 }}>
                Corrections are recorded against this visit and replace the triage-entered values.
              </div>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {[
                ['BP', `${vitals.bpSys || '—'}/${vitals.bpDia || '—'}`],
                ['HR', vitals.hr ? `${vitals.hr} bpm` : '—'],
                ['Temp', vitals.temp ? `${vitals.temp}${vitals.tempUnit || '°F'}` : '—'],
                ['SpO₂', vitals.spo2 ? `${vitals.spo2}%` : '—'],
                ['RR', vitals.rr ? `${vitals.rr}/min` : '—'],
                ['Wt', vitals.weight ? `${vitals.weight} ${vitals.weightUnit || 'kg'}` : '—'],
              ].map(([l, v]) => (
                <div key={l} style={{ background: '#fff', padding: '6px 8px', borderRadius: 6, border: '1px solid var(--sand-200)' }}>
                  <div style={{ fontSize: 10, color: 'var(--sand-400)' }}>{l}</div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--sand-900)' }}>{v}</div>
                </div>
              ))}
            </div>
          )}

          {vitals.chiefComplaint && (
            <div style={{ marginTop: 10, padding: '8px 10px', background: 'var(--teal-50)', borderRadius: 6, border: '1px solid var(--teal-100)' }}>
              <div style={{ fontSize: 10, color: 'var(--teal-600)', fontWeight: 600, marginBottom: 2 }}>CHIEF COMPLAINT</div>
              <div style={{ fontSize: 12, color: 'var(--sand-800)' }}>{vitals.chiefComplaint}</div>
            </div>
          )}
        </div>

        {/* Visit history */}
        <div style={{ flex: 1, overflow: 'auto', padding: '14px 18px' }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 10 }}>Visit History</div>
          {item.patient.visits.length === 0 ? (
            <div style={{ fontSize: 12, color: 'var(--sand-400)', fontStyle: 'italic' }}>No prior visits</div>
          ) : (
            item.patient.visits.map(v => (
              <div key={v.id} style={{ marginBottom: 14, padding: '10px 12px', background: '#fff', borderRadius: 8, border: '1px solid var(--sand-200)' }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--sand-700)', marginBottom: 4 }}>{v.date}</div>
                <div style={{ fontSize: 11, color: 'var(--sand-500)', marginBottom: 6 }}>{v.provider}</div>
                <div style={{ fontSize: 12, color: 'var(--sand-700)', marginBottom: 4 }}><strong>A:</strong> {v.soapp.assessment}</div>
                <div style={{ fontSize: 12, color: 'var(--sand-600)' }}><strong>P:</strong> {v.soapp.plan}</div>
                {v.prescriptions?.length > 0 && (
                  <div style={{ marginTop: 6, paddingTop: 6, borderTop: '1px solid var(--sand-100)' }}>
                    {v.prescriptions.map((rx, i) => (
                      <div key={i} style={{ fontSize: 11, color: 'var(--sand-500)' }}>💊 {rx.name} {rx.dose}</div>
                    ))}
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      </div>

      {/* Right pane — documentation */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        {/* Top bar */}
        <div style={{ padding: '14px 20px', borderBottom: '1px solid var(--sand-200)', display: 'flex', alignItems: 'center', gap: 16, background: '#fff' }}>
          <div style={{ display: 'flex', gap: 2 }}>
            {[
              { id: 'soapp', label: 'SOAPP Note' },
              { id: 'meds', label: 'Administered' },
              { id: 'rx', label: 'Pharmacy Requests' },
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                style={{
                  padding: '6px 14px', borderRadius: 'var(--radius-sm)', border: 'none',
                  background: activeTab === tab.id ? 'var(--teal-100)' : 'transparent',
                  color: activeTab === tab.id ? 'var(--teal-600)' : 'var(--sand-600)',
                  fontSize: 13, fontWeight: activeTab === tab.id ? 600 : 400,
                  cursor: 'pointer', fontFamily: 'var(--font-body)'
                }}>{tab.label}{tab.id === 'rx' && rxRequests.length > 0 && ` (${rxRequests.length})`}
              </button>
            ))}
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
            {lastSaved && <span style={{ fontSize: 11, color: 'var(--sand-400)' }}>Saved {formatTime(lastSaved)}</span>}
            <Button variant="ghost" size="sm" onClick={() => setLastSaved(new Date())}>↺ Save</Button>
          </div>
        </div>

        {/* Content */}
        <div style={{ flex: 1, overflow: 'auto', padding: '20px' }}>
          {activeTab === 'soapp' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              {soappSections.map(s => (
                <div key={s.key}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--sand-700)', marginBottom: 6, letterSpacing: '0.02em' }}>{s.label}</div>
                  <textarea value={note[s.key]} onChange={e => setN(s.key, e.target.value)}
                    placeholder={s.placeholder} rows={s.key === 'procedures' ? 2 : 4}
                    style={{
                      width: '100%', padding: '10px 12px', borderRadius: 'var(--radius-sm)',
                      border: '1.5px solid var(--sand-200)', fontSize: 14,
                      fontFamily: 'var(--font-body)', resize: 'vertical', outline: 'none',
                      lineHeight: 1.6, color: 'var(--sand-900)', background: '#fff'
                    }} />
                </div>
              ))}
            </div>
          )}

          {activeTab === 'meds' && (
            <div>
              <SectionHeader title="Administered in Clinic" count={adminMeds.length}
                action={<Button size="sm" onClick={addAdminMed}>+ Add</Button>} />
              {adminMeds.length === 0 ? (
                <div style={{ padding: '32px', textAlign: 'center', color: 'var(--sand-400)', fontSize: 14 }}>
                  No medications administered in clinic
                  <br/><Button variant="outline" size="sm" style={{ marginTop: 12 }} onClick={addAdminMed}>+ Add medication</Button>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {adminMeds.map(med => (
                    <Card key={med.id} style={{ padding: '14px 16px' }}>
                      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr auto', gap: 10, alignItems: 'end' }}>
                        <Input label="Medication / Vaccine" value={med.name} onChange={v => updateMed(med.id, 'name', v)} placeholder="Name or search..." />
                        <Input label="Dose" value={med.dose} onChange={v => updateMed(med.id, 'dose', v)} placeholder="500" unit={med.unit} />
                        <Select label="Route" value={med.route} onChange={v => updateMed(med.id, 'route', v)} options={[
                          { value: 'Oral', label: 'Oral' }, { value: 'IV', label: 'IV' }, { value: 'IM', label: 'IM' },
                          { value: 'SC', label: 'SC' }, { value: 'Topical', label: 'Topical' }, { value: 'Nebulized', label: 'Nebulized' }
                        ]} />
                        <Input label="Time" value={med.time} onChange={v => updateMed(med.id, 'time', v)} />
                        <button onClick={() => removeMed(med.id)} style={{ background: 'none', border: 'none', color: 'var(--red-400)', cursor: 'pointer', fontSize: 16, paddingBottom: 2 }}>✕</button>
                      </div>
                    </Card>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab === 'rx' && (
            <div>
              <SectionHeader title="Pharmacy Requests" count={rxRequests.length}
                action={<Button size="sm" onClick={addRx}>+ Add Rx</Button>} />
              {rxRequests.length === 0 ? (
                <div style={{ padding: '32px', textAlign: 'center', color: 'var(--sand-400)', fontSize: 14 }}>
                  No pharmacy requests added<br/>
                  <Button variant="outline" size="sm" style={{ marginTop: 12 }} onClick={addRx}>+ Add prescription</Button>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {rxRequests.map(rx => {
                    const allergyConflict = item.patient.allergies.some(a =>
                      rx.name.toLowerCase().includes(a.toLowerCase())
                    );
                    return (
                      <Card key={rx.id} style={{ padding: '16px' }}>
                        {allergyConflict && (
                          <div style={{ marginBottom: 10, padding: '8px 12px', background: 'var(--red-50)', border: '1.5px solid var(--red-400)', borderRadius: 6, fontSize: 12, color: 'var(--red-700)', fontWeight: 500 }}>
                            ⚠️ Allergy conflict detected — verify before dispensing
                          </div>
                        )}
                        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr auto', gap: 10, alignItems: 'end', marginBottom: 10 }}>
                          <Input label="Medication" value={rx.name} onChange={v => updateRx(rx.id, 'name', v)} placeholder="Medication name..." />
                          <Input label="Dose" value={rx.dose} onChange={v => updateRx(rx.id, 'dose', v)} placeholder="500" unit={rx.unit} />
                          <Select label="Route" value={rx.route} onChange={v => updateRx(rx.id, 'route', v)} options={[
                            { value: 'Oral', label: 'Oral' }, { value: 'IV', label: 'IV' }, { value: 'IM', label: 'IM' },
                            { value: 'SC', label: 'SC' }, { value: 'Topical', label: 'Topical' }
                          ]} />
                          <button onClick={() => removeRx(rx.id)} style={{ background: 'none', border: 'none', color: 'var(--red-400)', cursor: 'pointer', fontSize: 16, paddingBottom: 2 }}>✕</button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                          <Input label="Sig / Instructions" value={rx.sig} onChange={v => updateRx(rx.id, 'sig', v)} placeholder="e.g. Take with food, once daily..." />
                          <Input label="Notes to Pharmacist" value={rx.notes} onChange={v => updateRx(rx.id, 'notes', v)} placeholder="Optional clinical context..." />
                        </div>
                      </Card>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Bottom action bar */}
        <div style={{ padding: '14px 20px', borderTop: '1px solid var(--sand-200)', background: '#fff', display: 'flex', alignItems: 'center', gap: 12 }}>
          <Button variant="ghost" size="sm" onClick={() => {}}>Discharge Patient</Button>
          <div style={{ flex: 1 }}></div>
          <Button variant="secondary" onClick={() => onClose(false, vitals)}>Close Visit Directly</Button>
          <Button onClick={handleSendToPharmacy}>Send to Pharmacy →</Button>
        </div>
      </div>
    </div>
  );
}

// ─── PHARMACY VIEWS ───────────────────────────────────────────────────────────
function PharmacyView({ queue, onAssume }) {
  const [expanded, setExpanded] = useState(null);
  const queueStyle = useQueueStyle();
  const isOpen = (id) => queueStyle === 'detailed' ? true : queueStyle === 'compact' ? false : expanded === id;
  const toggler = (id) => queueStyle === 'hybrid' ? () => setExpanded(expanded === id ? null : id) : null;
  return (
    <div style={{ padding: '24px', maxWidth: 900, margin: '0 auto' }}>
      <div style={{ marginBottom: 24, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 600, color: 'var(--sand-900)' }}>Pharmacy Queue</h1>
          <p style={{ fontSize: 13, color: 'var(--sand-600)', marginTop: 2 }}>Prescriptions awaiting fulfillment</p>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#30A99B', animation: 'pulse 2s infinite' }}></div>
          <span style={{ fontSize: 12, color: 'var(--sand-600)' }}>Live</span>
        </div>
      </div>

      {queue.length === 0 ? (
        <Card style={{ padding: '60px', textAlign: 'center' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <div style={{ fontSize: 16, fontWeight: 500, color: 'var(--sand-700)' }}>Queue is empty</div>
          <div style={{ fontSize: 13, color: 'var(--sand-500)', marginTop: 4 }}>No prescriptions pending</div>
        </Card>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {queue.map((item, i) => (
            <QueueCard key={item.id} item={item} index={i}
              expanded={isOpen(item.id)}
              onToggle={toggler(item.id)}
              onAssume={() => onAssume(item)}
              actionLabel="Assume Patient"
              showVitals={false} />
          ))}
        </div>
      )}
    </div>
  );
}

function PharmacyFulfillment({ item, onClose, onDirtyChange }) {
  const [rxStatus, setRxStatus] = useState(
    item.rxRequests.map(rx => ({ ...rx, status: 'pending', qty: '', reason: '', freq: 'once_daily', reminder: false }))
  );
  const [showCloseConfirm, setShowCloseConfirm] = useState(false);

  const updateStatus = (id, updates) => {
    setRxStatus(s => s.map(r => r.id === id ? { ...r, ...updates } : r));
  };

  useReportDirty(
    rxStatus.some(r => r.status !== 'pending' || r.qty || r.reason || r.reminder),
    onDirtyChange
  );

  const allAddressed = rxStatus.every(r => r.status !== 'pending');
  const hasAllergyConflict = (rx) => item.patient.allergies.some(a => rx.name.toLowerCase().includes(a.toLowerCase()));

  return (
    <div style={{ display: 'flex', height: '100%', overflow: 'hidden' }}>
      {/* Left: Patient info */}
      <div style={{ width: 300, background: 'var(--sand-50)', borderRight: '1px solid var(--sand-200)', display: 'flex', flexDirection: 'column', overflow: 'auto', flexShrink: 0 }}>
        <div style={{ padding: '20px 18px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
            <PhotoPlaceholder name={patientName(item.patient)} size={52} />
            <div>
              <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--sand-900)' }}>{patientName(item.patient)}</div>
              <div style={{ fontSize: 12, color: 'var(--sand-600)' }}>{calcAge(item.patient.dob)}y · {item.patient.gender}</div>
              <div style={{ fontSize: 11, color: 'var(--sand-500)' }}>Provider: {item.provider}</div>
            </div>
          </div>

          {/* PROMINENT allergy warning */}
          {item.patient.allergies.length > 0 ? (
            <div style={{
              background: 'var(--red-50)', border: '2px solid var(--red-500)', borderRadius: 'var(--radius-md)',
              padding: '12px 14px', marginBottom: 14
            }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--red-700)', marginBottom: 6 }}>⚠️ ALLERGIES — REVIEW BEFORE DISPENSING</div>
              {item.patient.allergies.map((a, i) => (
                <div key={i} style={{ fontSize: 13, color: 'var(--red-700)', fontWeight: 600, padding: '2px 0' }}>• {a}</div>
              ))}
            </div>
          ) : (
            <div style={{ background: 'var(--teal-50)', border: '1.5px solid var(--teal-200)', borderRadius: 'var(--radius-md)', padding: '10px 14px', marginBottom: 14 }}>
              <div style={{ fontSize: 13, color: 'var(--teal-600)', fontWeight: 500 }}>✓ No known allergies (NKDA)</div>
            </div>
          )}

          {/* Vitals from this visit */}
          {item.vitals && (
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 8 }}>Vitals</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                {[
                  ['BP', `${item.vitals.bpSys || '—'}/${item.vitals.bpDia || '—'}`],
                  ['HR', item.vitals.hr ? `${item.vitals.hr} bpm` : '—'],
                  ['Temp', item.vitals.temp ? `${item.vitals.temp}${item.vitals.tempUnit || '°F'}` : '—'],
                  ['SpO₂', item.vitals.spo2 ? `${item.vitals.spo2}%` : '—'],
                ].map(([l, v]) => (
                  <div key={l} style={{ background: '#fff', padding: '6px 8px', borderRadius: 6, border: '1px solid var(--sand-200)' }}>
                    <div style={{ fontSize: 10, color: 'var(--sand-400)' }}>{l}</div>
                    <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-900)' }}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Full SOAPP note, read-only */}
          <div>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 8 }}>Clinical Notes (Read Only)</div>
            {item.vitals?.chiefComplaint && (
              <div style={{ marginBottom: 8, padding: '8px 10px', background: 'var(--teal-50)', borderRadius: 6, border: '1px solid var(--teal-100)' }}>
                <div style={{ fontSize: 10, color: 'var(--teal-600)', fontWeight: 600, letterSpacing: '0.06em' }}>CHIEF COMPLAINT</div>
                <div style={{ fontSize: 12, color: 'var(--sand-800)', lineHeight: 1.5 }}>{item.vitals.chiefComplaint}</div>
              </div>
            )}
            <SoappReadout note={item.note} compact />
          </div>
        </div>
      </div>

      {/* Right: Fulfillment */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--sand-200)', background: '#fff' }}>
          <h2 style={{ fontSize: 16, fontWeight: 600, color: 'var(--sand-900)' }}>Prescription Fulfillment</h2>
          <div style={{ fontSize: 13, color: 'var(--sand-500)', marginTop: 2 }}>
            {rxStatus.filter(r => r.status !== 'pending').length} of {rxStatus.length} addressed
          </div>
        </div>

        <div style={{ flex: 1, overflow: 'auto', padding: '20px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {rxStatus.map((rx, i) => {
              const conflict = hasAllergyConflict(rx);
              return (
                <Card key={rx.id} style={{ padding: '18px 20px', borderLeft: `4px solid ${rx.status === 'filled' ? '#30A99B' : rx.status === 'partial' ? '#FBBF24' : rx.status === 'unfilled' ? '#EF4444' : 'var(--sand-300)'}` }}>
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
                      <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--sand-900)' }}>#{i + 1} {rx.name}</span>
                      {conflict && <Badge color="red">⚠ Allergy Conflict</Badge>}
                    </div>
                    <div style={{ fontSize: 13, color: 'var(--sand-600)' }}>
                      {rx.dose} {rx.unit} · {rx.route}
                      {rx.sig && ` · "${rx.sig}"`}
                    </div>
                    {rx.notes && <div style={{ fontSize: 12, color: 'var(--teal-600)', marginTop: 4 }}>📝 Provider note: {rx.notes}</div>}
                  </div>

                  {conflict && (
                    <div style={{ marginBottom: 12, padding: '10px 12px', background: 'var(--red-50)', border: '1.5px solid var(--red-400)', borderRadius: 6 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--red-700)' }}>⚠️ ALLERGY CONFLICT — Cannot dismiss this warning</div>
                      <div style={{ fontSize: 12, color: 'var(--red-600)', marginTop: 2 }}>This medication matches a known patient allergy. If proceeding, document override reason below.</div>
                    </div>
                  )}

                  {/* Status buttons */}
                  <div style={{ display: 'flex', gap: 8, marginBottom: rx.status !== 'pending' ? 12 : 0 }}>
                    {[
                      { value: 'filled', label: '✓ Filled', color: '#30A99B' },
                      { value: 'partial', label: '~ Partial', color: '#D97706' },
                      { value: 'unfilled', label: '✕ Unable', color: '#EF4444' },
                    ].map(opt => (
                      <button key={opt.value} onClick={() => updateStatus(rx.id, { status: opt.value })}
                        style={{
                          padding: '7px 16px', borderRadius: 'var(--radius-sm)', border: `1.5px solid ${rx.status === opt.value ? opt.color : 'var(--sand-300)'}`,
                          background: rx.status === opt.value ? opt.color : 'transparent',
                          color: rx.status === opt.value ? '#fff' : 'var(--sand-600)',
                          cursor: 'pointer', fontSize: 13, fontWeight: 500, fontFamily: 'var(--font-body)'
                        }}>{opt.label}</button>
                    ))}
                  </div>

                  {rx.status === 'filled' && (
                    <div className="animate-in" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginTop: 10 }}>
                      <Input label="Qty Dispensed" value={rx.qty} onChange={v => updateStatus(rx.id, { qty: v })} placeholder="e.g. 10 tablets" />
                      <Select label="Frequency" value={rx.freq} onChange={v => updateStatus(rx.id, { freq: v })} options={[
                        { value: 'once_daily', label: 'Once daily' },
                        { value: 'twice_daily', label: 'Twice daily' },
                        { value: 'three_daily', label: 'Three times daily' },
                        { value: 'prn', label: 'As needed' },
                        { value: 'other', label: 'Other' },
                      ]} />
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                        <label style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-700)' }}>Reminder</label>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingTop: 4 }}>
                          <input type="checkbox" checked={rx.reminder} onChange={e => updateStatus(rx.id, { reminder: e.target.checked })} />
                          <span style={{ fontSize: 13 }}>Set reminder</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {(rx.status === 'partial' || rx.status === 'unfilled') && (
                    <div className="animate-in" style={{ marginTop: 10 }}>
                      <Input label="Reason" value={rx.reason} onChange={v => updateStatus(rx.id, { reason: v })}
                        placeholder={rx.status === 'partial' ? 'Out of stock, partial supply...' : 'Out of stock, contraindication...'} />
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        </div>

        {/* Close bar */}
        <div style={{ padding: '14px 20px', borderTop: '1px solid var(--sand-200)', background: '#fff', display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{ fontSize: 13, color: allAddressed ? 'var(--teal-600)' : 'var(--sand-500)' }}>
            {allAddressed ? '✓ All prescriptions addressed' : `${rxStatus.filter(r => r.status === 'pending').length} prescription(s) pending`}
          </span>
          <div style={{ flex: 1 }}></div>
          <Button variant="ghost" size="sm">Flag Provider</Button>
          <Button disabled={!allAddressed} onClick={() => onClose(item)}>
            Close Patient Chart ✓
          </Button>
        </div>
      </div>
    </div>
  );
}

    if (!newVol.name || !newVol.email) return;
    setVolunteers(v => [...v, { id: 'U' + Date.now(), ...newVol }]);
    setNewVol({ name: '', email: '', role: 'Provider' });

    return (
      <div style={{ padding: '32px 24px', maxWidth: 700, margin: '0 auto' }}>

          <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 16, color: 'var(--sand-700)' }}>Trip Details</h3>

            <Input label="End Date" value="2026-05-07" type="date" onChange={() => {}} />

        </Card>
        <Card style={{ padding: '24px' }}>
          <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: 'var(--sand-700)' }}>Status</h3>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 14 }}>
            {[['Volunteers', volunteers.length], ['Active Today', '5'], ['Patients Seen', '24']].map(([l, v]) => (
              <div key={l} style={{ padding: '16px', background: 'var(--teal-50)', borderRadius: 'var(--radius-md)', textAlign: 'center' }}>

        <h1 style={{ fontSize: 22, fontWeight: 600, marginBottom: 24 }}>Dashboard</h1>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14, marginBottom: 24 }}>
          {[
            ['Completed Today', '24', 'teal'],
            ['In Progress', '3', 'amber'],
            ['Rx Fill Rate', '96%', 'teal'],
            ['Avg Wait', '14 min', 'sand'],
          ].map(([l, v, color]) => (
            <Card key={l} style={{ padding: '20px' }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: color === 'teal' ? 'var(--teal-500)' : color === 'amber' ? 'var(--amber-600)' : 'var(--sand-700)' }}>{v}</div>
              <div style={{ fontSize: 13, color: 'var(--sand-500)', marginTop: 4 }}>{l}</div>
            </Card>
          ))}
        </div>
        <Card style={{ padding: '24px' }}>
          <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, color: 'var(--sand-700)' }}>Recent Completed Visits</h3>
          {[
            { name: 'Maria Santos', provider: 'Dr. Chen', pharmacy: 'M. Flores', rx: '2/2', duration: '32 min' },
            { name: 'Carlos Mendez', provider: 'Dr. Patel', pharmacy: 'M. Flores', rx: '1/1', duration: '18 min' },
            { name: 'Ana Reyes', provider: 'Dr. Chen', pharmacy: 'M. Flores', rx: '3/3', duration: '41 min' },
          ].map((r, i) => (
            <div key={i} style={{ display: 'flex', gap: 16, padding: '12px 0', borderBottom: '1px solid var(--sand-100)', alignItems: 'center' }}>
              <PhotoPlaceholder name={r.name} size={36} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 500 }}>{r.name}</div>
                <div style={{ fontSize: 12, color: 'var(--sand-500)' }}>{r.provider} · {r.pharmacy}</div>
              </div>
              <Badge color="teal">Rx {r.rx}</Badge>
              <span style={{ fontSize: 12, color: 'var(--sand-500)' }}>{r.duration}</span>
              <Badge color="green">Complete</Badge>
            </div>
          ))}
        </Card>
      </div>

  }

  return (
    <div style={{ padding: '32px 24px', maxWidth: 800, margin: '0 auto' }}>

        <Card style={{ padding: '20px', marginBottom: 16, border: '1.5px solid var(--teal-300)' }}>

            <Input label="Email" value={newVol.email} onChange={v => setNewVol(n => ({ ...n, email: v }))} required />
            <Select label="Role" value={newVol.role} onChange={v => setNewVol(n => ({ ...n, role: v }))} options={[
              { value: 'Triage', label: 'Triage' }, { value: 'Provider', label: 'Provider' },
              { value: 'Pharmacy', label: 'Pharmacy' }, { value: 'Manager', label: 'Manager' }

              <Button variant="secondary" onClick={() => setShowAdd(false)}>Cancel</Button>

      <Card>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: 'var(--sand-50)' }}>
              {['Volunteer', 'Role', 'Email', 'Status', ''].map(h => (
                <th key={h} style={{ padding: '12px 16px', textAlign: 'left', fontSize: 12, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.04em', textTransform: 'uppercase', borderBottom: '1px solid var(--sand-200)' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {volunteers.map((v, i) => (
              <tr key={v.id} style={{ borderBottom: '1px solid var(--sand-100)' }}>
                <td style={{ padding: '12px 16px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <PhotoPlaceholder name={v.name} size={32} />
                    <span style={{ fontSize: 14, fontWeight: 500 }}>{v.name}</span>

                <td style={{ padding: '12px 16px' }}>

                <td style={{ padding: '12px 16px' }}><Badge color="green">Active</Badge></td>
                <td style={{ padding: '12px 16px', textAlign: 'right' }}>
                  <Button variant="ghost" size="sm">Edit</Button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

// ─── ADDENDUM MODAL ───────────────────────────────────────────────────────────
function AddendumModal({ visit, role, onClose }) {
  const [activeSection, setActiveSection] = useState('soapp');
  const [addendumText, setAddendumText] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [addenda, setAddenda] = useState(visit.addenda || {});

  const roleScope = {
    Triage: ['triage'],
    Provider: ['soapp', 'meds'],
    Pharmacy: ['rx'],
    Manager: ['soapp', 'meds', 'rx', 'triage'],
  };
  const canAddend = (section) => (roleScope[role] || []).includes(section);

  const submitAddendum = () => {
    if (!addendumText.trim()) return;
    const entry = {
      text: addendumText,
      author: role === 'Triage' ? 'J. Rivera' : role === 'Provider' ? 'Dr. Chen' : role === 'Pharmacy' ? 'M. Flores' : 'T. Wright',
      role,
      time: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    };
    setAddenda(a => ({ ...a, [activeSection]: [...(a[activeSection] || []), entry] }));
    setAddendumText('');
    setShowForm(false);
  };

  const sections = [
    { id: 'soapp', label: 'SOAPP Note', icon: '📝' },
    { id: 'meds', label: 'Administered', icon: '💉' },
    { id: 'rx', label: 'Dispensed Rx', icon: '💊' },
  ];

  const sectionContent = {
    soapp: visit.note ? [
      { label: 'S — Subjective', value: visit.note.subjective },
      { label: 'O — Objective', value: visit.note.objective },
      { label: 'A — Assessment', value: visit.note.assessment },
      { label: 'P — Plan', value: visit.note.plan },
      { label: 'Procedures', value: visit.note.procedures },
    ].filter(x => x.value) : [],
    meds: (visit.adminMeds || []).map(m => ({ label: 'Administered', value: `${m.name} ${m.dose}${m.unit} · ${m.route} · ${m.time}` })),
    rx: (visit.rxRequests || []).map(r => ({ label: r.status || 'Rx', value: `${r.name} ${r.dose}${r.unit} · ${r.route} · "${r.sig}"` })),
  };

  return (
    <div className="fade-in" style={{
      position: 'fixed', inset: 0, background: 'rgba(44,36,25,0.5)', zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24
    }}>
      <div className="animate-in" style={{
        background: '#fff', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow-lg)',
        width: '100%', maxWidth: 860, maxHeight: '90vh', display: 'flex', flexDirection: 'column', overflow: 'hidden'
      }}>
        {/* Header */}
        <div style={{ padding: '16px 24px', borderBottom: '1px solid var(--sand-200)', display: 'flex', alignItems: 'center', gap: 14, background: 'var(--sand-50)' }}>
          <PhotoPlaceholder name={patientName(visit.patient)} size={40} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{patientName(visit.patient)}</div>
            <div style={{ fontSize: 12, color: 'var(--sand-500)' }}>
              Completed Visit · {formatTime()} &nbsp;·&nbsp;
              <span style={{ color: 'var(--sand-400)' }}>Read-only — addenda only</span>
            </div>
          </div>
          <AllergyBanner allergies={visit.patient.allergies} />
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 20, color: 'var(--sand-400)', padding: '4px 8px' }}>✕</button>
        </div>

        <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
          {/* Section nav */}
          <div style={{ width: 180, borderRight: '1px solid var(--sand-200)', padding: '16px 12px', background: 'var(--sand-50)', flexShrink: 0 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 10 }}>Sections</div>
            {sections.map(s => (
              <button key={s.id} onClick={() => { setActiveSection(s.id); setShowForm(false); setAddendumText(''); }}
                style={{
                  display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '8px 10px',
                  borderRadius: 'var(--radius-sm)', border: 'none', cursor: 'pointer', marginBottom: 3,
                  background: activeSection === s.id ? 'var(--sand-200)' : 'transparent',
                  fontFamily: 'var(--font-body)', fontSize: 13,
                  color: activeSection === s.id ? 'var(--sand-900)' : 'var(--sand-600)',
                  fontWeight: activeSection === s.id ? 500 : 400
                }}>
                <span>{s.icon}</span>
                <span style={{ flex: 1, textAlign: 'left' }}>{s.label}</span>
                {(addenda[s.id] || []).length > 0 && (
                  <span style={{ background: 'var(--amber-100)', color: 'var(--amber-600)', borderRadius: 99, padding: '1px 6px', fontSize: 10, fontWeight: 600 }}>
                    {(addenda[s.id] || []).length}
                  </span>
                )}
              </button>
            ))}

            <div style={{ marginTop: 16, padding: '10px', background: 'var(--teal-50)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--teal-100)' }}>
              <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--teal-600)', marginBottom: 4 }}>Your scope</div>
              <div style={{ fontSize: 11, color: 'var(--teal-600)' }}>
                {role}: {roleScope[role]?.join(', ') || 'none'}
              </div>
            </div>
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflow: 'auto', padding: '20px 24px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <h3 style={{ fontSize: 15, fontWeight: 600 }}>{sections.find(s => s.id === activeSection)?.label}</h3>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <Badge color="sand">Read Only</Badge>
                {canAddend(activeSection) && !showForm && (
                  <Button size="sm" onClick={() => setShowForm(true)}>+ Add Addendum</Button>
                )}
                {!canAddend(activeSection) && (
                  <span style={{ fontSize: 11, color: 'var(--sand-400)', fontStyle: 'italic' }}>Outside your role scope</span>
                )}
              </div>
            </div>

            {/* Original content */}
            {sectionContent[activeSection]?.length > 0 ? (
              <div style={{ background: 'var(--sand-50)', border: '1px solid var(--sand-200)', borderRadius: 'var(--radius-md)', overflow: 'hidden', marginBottom: 16 }}>
                {sectionContent[activeSection].map((item, i) => (
                  <div key={i} style={{ padding: '12px 16px', borderBottom: i < sectionContent[activeSection].length - 1 ? '1px solid var(--sand-200)' : 'none' }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--sand-500)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{item.label}</div>
                    <div style={{ fontSize: 13, color: 'var(--sand-800)', lineHeight: 1.6 }}>{item.value || <span style={{ color: 'var(--sand-400)', fontStyle: 'italic' }}>— not recorded —</span>}</div>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ padding: '24px', background: 'var(--sand-50)', borderRadius: 'var(--radius-md)', textAlign: 'center', color: 'var(--sand-400)', fontSize: 13, marginBottom: 16, fontStyle: 'italic' }}>
                No content recorded in this section
              </div>
            )}

            {/* Existing addenda */}
            {(addenda[activeSection] || []).map((a, i) => (
              <div key={i} className="animate-in" style={{
                background: '#FFFBF0', border: '1.5px solid var(--amber-400)', borderRadius: 'var(--radius-md)',
                padding: '12px 16px', marginBottom: 10
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--amber-600)', flexShrink: 0 }}></div>
                  <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--amber-600)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Addendum</span>
                  <span style={{ fontSize: 11, color: 'var(--sand-500)', marginLeft: 'auto' }}>
                    {a.author} · {a.role} · {a.time}
                  </span>
                </div>
                <div style={{ fontSize: 13, color: 'var(--sand-800)', lineHeight: 1.6 }}>{a.text}</div>
              </div>
            ))}

            {/* Addendum form */}
            {showForm && canAddend(activeSection) && (
              <div className="animate-in" style={{ background: '#fff', border: '1.5px solid var(--teal-400)', borderRadius: 'var(--radius-md)', padding: '16px' }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--sand-800)', marginBottom: 4 }}>New Addendum</div>
                <div style={{ fontSize: 11, color: 'var(--sand-500)', marginBottom: 12 }}>
                  Will be recorded as <strong>{role === 'Provider' ? 'Dr. Chen' : role === 'Pharmacy' ? 'M. Flores' : 'J. Rivera'} · {role}</strong> · Cannot be edited after submission
                </div>
                <Textarea value={addendumText} onChange={setAddendumText}
                  placeholder="Enter addendum text — describe the correction or additional information..."
                  rows={4} />
                <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 12 }}>
                  <Button variant="secondary" size="sm" onClick={() => { setShowForm(false); setAddendumText(''); }}>Cancel</Button>
                  <Button size="sm" disabled={!addendumText.trim()} onClick={submitAddendum}>Submit Addendum</Button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
