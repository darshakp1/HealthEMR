// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [role, setRole] = useState('Triage');
  const [activeView, setActiveView] = useState('search');
  const [patients, setPatients] = useState(SEED_PATIENTS);
  const [careQueue, setCareQueue] = useState([]);
  const [pharmacyQueue, setPharmacyQueue] = useState([]);
  const [completed, setCompleted] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [trip] = useState(SEED_TRIP);

  // Current active patient being treated (by role)
  const [activeTriagePatient, setActiveTriagePatient] = useState(null);
  const [triageStep, setTriageStep] = useState('search'); // search | new | vitals
  const [activeCarePatient, setActiveCarePatient] = useState(null);
  const [activePharmacyPatient, setActivePharmacyPatient] = useState(null);

  // Unsaved-work guard for sidebar navigation
  const dirtyRef = useRef(false);
  const [pendingNav, setPendingNav] = useState(null);

  // Tweaks
  const { tweaks, setTweak } = useTweaks(TWEAK_DEFAULTS);
  const darkMode = tweaks?.darkMode || false;

  // Apply dark mode to body
  useEffect(() => {
    document.body.classList.toggle('dark-mode', darkMode);
  }, [darkMode]);

  // Warm / cool palette
  useEffect(() => {
    document.body.classList.toggle('theme-cool', tweaks.theme === 'cool');
  }, [tweaks.theme]);

  // Accent colour drives every primary button, active state and highlight
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor || '#1E8A7D');
  }, [tweaks.accentColor]);

  // ── TRIAGE FLOW ──
  const handleTriageSelect = (patient) => {
    setActiveTriagePatient(patient);
    setTriageStep('vitals');
  };

  const handleNewPatient = () => setTriageStep('new');

  const handleNewPatientComplete = (patientData) => {
    if (!patientData) { setTriageStep('search'); return; }
    const newP = { ...patientData };
    setPatients(p => [...p, newP]);
    setActiveTriagePatient(newP);
    setTriageStep('vitals');
  };

  const handleCheckIn = (vitalsData) => {
    const queueItem = {
      id: 'Q' + Date.now(),
      patient: activeTriagePatient,
      vitals: vitalsData.vitals,
      checkInTime: Date.now(),
      triageInitials: 'JR',
      warnings: [],
      rxRequests: [],
    };
    if (vitalsData.vitals.spo2 && parseFloat(vitalsData.vitals.spo2) < 90) queueItem.warnings.push('Low SpO2');
    if (vitalsData.vitals.hr && parseInt(vitalsData.vitals.hr) > 120) queueItem.warnings.push('Tachycardia');
    setCareQueue(q => [...q, queueItem]);
    setActiveTriagePatient(null);
    setTriageStep('search');
    setActiveView('search');
  };

  // ── PROVIDER FLOW ──
  const handleAssumePatient = (item) => {
    setActiveCarePatient(item);
  };

  const handleProviderClose = (item, sendToPharmacy, data, vitals) => {
    const merged = vitals ? { ...item, vitals } : item;
    setCareQueue(q => q.filter(x => x.id !== item.id));
    if (sendToPharmacy && data) {
      const pharmItem = { ...merged, ...data, provider: 'Dr. Chen' };
      setPharmacyQueue(q => [...q, pharmItem]);
    } else {
      setCompleted(c => [...c, merged]);
    }
    setActiveCarePatient(null);
  };

  const handleSendToPharmacy = (data) => {
    handleProviderClose(activeCarePatient, true, data);
  };

  // ── PHARMACY FLOW ──
  const handlePharmacyAssume = (item) => {
    setActivePharmacyPatient(item);
  };

  const handlePharmacyClose = (item) => {
    setPharmacyQueue(q => q.filter(x => x.id !== item.id));
    setCompleted(c => [...c, item]);
    setActivePharmacyPatient(null);
  };

  // Leaving a screen abandons the encounter in progress — a half-entered
  // vitals form or SOAPP note is discarded rather than following you around.
  const clearActiveEncounters = () => {
    dirtyRef.current = false;
    setActiveTriagePatient(null);
    setTriageStep('search');
    setActiveCarePatient(null);
    setActivePharmacyPatient(null);
  };

  // The open screen reports whether it holds unsaved input. Kept in a ref so a
  // keystroke doesn't re-render the sidebar.
  const setDirty = useCallback((value) => { dirtyRef.current = value; }, []);

  // Runs `action` immediately, or parks it behind a confirmation when the
  // current screen would lose work.
  const guard = (action) => {
    if (dirtyRef.current) setPendingNav(() => action);
    else action();
  };

  const navigate = (view) => guard(() => {
    clearActiveEncounters();
    setActiveView(view);
  });

  const changeRole = (nextRole, defaultView) => guard(() => {
    clearActiveEncounters();
    setRole(nextRole);
    setActiveView(defaultView);
  });

  // Determine what to render
  const renderMain = () => {
    // Command Center — available to every role
    if (activeView === 'command') {
      return <CommandCenter careQueue={careQueue} pharmacyQueue={pharmacyQueue} completed={completed} darkMode={darkMode} />;
    }

    // TRIAGE
    if (role === 'Triage') {
      if (triageStep === 'new') return <NewPatientForm onComplete={handleNewPatientComplete} onDirtyChange={setDirty} />;
      if (triageStep === 'vitals' && activeTriagePatient) {
        return <VitalsForm patient={activeTriagePatient} onComplete={handleCheckIn} onDirtyChange={setDirty} />;
      }
      if (activeView === 'checkins') {
        return (
          <div style={{ padding: '24px', maxWidth: 700, margin: '0 auto' }}>
            <h1 style={{ fontSize: 22, fontWeight: 600, marginBottom: 20 }}>Checked In Today</h1>
            {careQueue.length === 0 ? (
              <Card style={{ padding: '48px', textAlign: 'center', color: 'var(--sand-400)' }}>No patients checked in yet</Card>
            ) : (
              careQueue.map((item, i) => (
                <Card key={item.id} style={{ padding: '16px 20px', marginBottom: 10 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                    <PhotoPlaceholder name={patientName(item.patient)} size={40} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600 }}>{patientName(item.patient)}</div>
                      <div style={{ fontSize: 13, color: 'var(--sand-500)' }}>{minutesAgo(item.checkInTime)}</div>
                    </div>
                    <Badge color="teal">In Care Queue</Badge>
                  </div>
                </Card>
              ))
            )}
          </div>
        );
      }
      return <TriageSearch patients={patients} onCheckIn={handleTriageSelect} onNewPatient={handleNewPatient} />;
    }

    // PROVIDER
    if (role === 'Provider') {
      if (activeCarePatient) {
        return <SOAPPView item={activeCarePatient} onClose={(direct, vitals) => handleProviderClose(activeCarePatient, !direct, null, vitals)} onSendToPharmacy={handleSendToPharmacy} onDirtyChange={setDirty} />;
      }
      if (activeView === 'completed') return <CompletedDashboard completed={completed} role={role} />;
      return <CareQueue queue={careQueue} onAssume={handleAssumePatient} />;
    }

    // PHARMACY
    if (role === 'Pharmacy') {
      if (activePharmacyPatient) {
        return <PharmacyFulfillment item={activePharmacyPatient} onClose={handlePharmacyClose} onDirtyChange={setDirty} />;
      }
      if (activeView === 'completed') return <CompletedDashboard completed={completed} role={role} />;
      return <PharmacyView queue={pharmacyQueue} onAssume={handlePharmacyAssume} />;
    }

    // MANAGER
    if (activeView === 'overview') return <OverviewView careQueue={careQueue} pharmacyQueue={pharmacyQueue} completed={completed} darkMode={darkMode} />;
    return <ManagerView trip={trip} activeView={activeView} />;
  };

  return (
    <TweaksCtx.Provider value={{ tweaks, setTweak }}>
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: 'var(--sand-100)' }}>
      <Sidebar role={role} setRole={changeRole}
        activeView={activeView} setView={navigate} trip={trip} notifications={notifications}
        darkMode={darkMode} onToggleDark={() => setTweak('darkMode', !darkMode)} />
      <div style={{ flex: 1, overflow: 'auto' }}>
        {renderMain()}
      </div>

      {pendingNav && (
        <ConfirmDiscardModal
          onCancel={() => setPendingNav(null)}
          onDiscard={() => { const go = pendingNav; setPendingNav(null); go(); }} />
      )}

      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection title="Appearance">
          <TweakToggle id="darkMode" label="Dark Mode" />
          <TweakRadio id="theme" label="Palette" options={[{ value: 'warm', label: 'Warm' }, { value: 'cool', label: 'Cool' }]} />
          <TweakRadio id="density" label="Density" options={[{ value: 'compact', label: 'Compact' }, { value: 'comfortable', label: 'Comfy' }, { value: 'spacious', label: 'Spacious' }]} />
          <TweakColor id="accentColor" label="Accent" swatches={['#1E8A7D', '#2563EB', '#7C3AED', '#D97706', '#B91C1C']} />
        </TweakSection>
        <TweakSection title="Queues">
          <TweakRadio id="queueStyle" label="Card Style" options={[{ value: 'compact', label: 'Compact' }, { value: 'hybrid', label: 'Hybrid' }, { value: 'detailed', label: 'Detailed' }]} />
        </TweakSection>
        <TweakSection title="Quick Demo">
          <TweakButton label="Add Patient to Care Queue" onClick={() => {
            setCareQueue(q => [...q, {
              id: 'Q' + Date.now(),
              patient: SEED_PATIENTS[0],
              vitals: { bpSys: '142', bpDia: '88', hr: '88', rr: '18', temp: '99.2', tempUnit: '°F', weight: '62', weightUnit: 'kg', height: '162', heightUnit: 'cm', spo2: '97', chiefComplaint: 'Persistent headache and dizziness' },
              checkInTime: Date.now() - 600000,
              triageInitials: 'JR',
              warnings: [],
              rxRequests: [],
            }]);
          }} />
          <TweakButton label="Add Patient to Pharmacy Queue" onClick={() => {
            setPharmacyQueue(q => [...q, {
              id: 'PQ' + Date.now(),
              patient: SEED_PATIENTS[2],
              vitals: { bpSys: '118', bpDia: '76', hr: '72', spo2: '99', chiefComplaint: 'Joint pain' },
              checkInTime: Date.now() - 900000,
              provider: 'Dr. Patel',
              note: { subjective: 'Joint pain for 3 days', objective: 'Mild tenderness', assessment: 'Viral arthralgia', plan: 'Rest and analgesics' },
              rxRequests: [
                { id: 1, name: 'Acetaminophen', dose: '500', unit: 'mg', route: 'Oral', sig: 'Q6H PRN pain', notes: 'Avoid NSAIDs — allergy' },
                { id: 2, name: 'Ibuprofen', dose: '400', unit: 'mg', route: 'Oral', sig: 'TID with food', notes: '' }
              ],
            }]);
          }} />
        </TweakSection>
      </TweaksPanel>
    </div>
    </TweaksCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
